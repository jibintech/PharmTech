spring.application.name=pharmtech

# Dedicated Database configuration for PharmTech
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/pharmtech_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DATABASE_USERNAME:pharmtech_user}
spring.datasource.password=${DATABASE_PASSWORD:pharmtech_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Secret
jwt.secret=7d40dd5050f157ccfcf01d1c81ef9422f25b29f799c26be9f55c1143a5ba800f
jwt.expiration=86400000

# File Upload Max Size
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

